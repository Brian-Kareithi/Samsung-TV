<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>ICT Department</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;1,700;1,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Written for the TV's 2018 Tizen browser: plain ES5, no backdrop-filter, no CSS variables. */
  html, body { margin: 0; height: 100%; background: #0b0b0b; overflow: hidden; cursor: none; }
  body { font-family: "Barlow Condensed", "Arial Narrow", Arial, sans-serif; color: #f2efe6; -webkit-font-smoothing: antialiased;
    text-shadow: 0 1px 2px rgba(0,0,0,.6), 0 0 18px rgba(0,0,0,.45); }
  .sec { text-shadow: none; }
  .mono { font-family: "JetBrains Mono", Consolas, monospace; }

  .slide { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    background-size: cover; background-position: center; opacity: 0;
    -webkit-transition: opacity 1.6s ease; transition: opacity 1.6s ease; }
  .slide.show { opacity: 1; -webkit-animation: drift 26s linear forwards; animation: drift 26s linear forwards; }
  @-webkit-keyframes drift { from { -webkit-transform: scale(1.0); } to { -webkit-transform: scale(1.06); } }
  @keyframes drift { from { transform: scale(1.0); } to { transform: scale(1.06); } }

  .shade-top { position: absolute; left: 0; right: 0; top: 0; height: 260px;
    background: linear-gradient(to bottom, rgba(0,0,0,.72), rgba(0,0,0,0)); }
  .shade-bot { position: absolute; left: 0; right: 0; bottom: 0; height: 460px;
    background: linear-gradient(to top, rgba(0,0,0,.88), rgba(0,0,0,0)); }

  /* Wordmark, top left */
  .brand { position: absolute; left: 76px; top: 58px; }
  .brand-name { font-size: 58px; font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: 1px; line-height: 1; }
  .brand-name .tag { color: #ffd400; font-family: "JetBrains Mono", Consolas, monospace; font-style: normal; font-weight: 700; font-size: 44px; margin-right: 14px; position: relative; top: -4px; }
  .brand-sub { margin-top: 10px; font-size: 20px; color: rgba(242,239,230,.7); }
  .brand-sub .cursor { display: inline-block; width: 11px; height: 22px; background: #ffd400; margin-left: 6px; vertical-align: -4px;
    -webkit-animation: blink 1.1s steps(1) infinite; animation: blink 1.1s steps(1) infinite; }
  @-webkit-keyframes blink { 50% { opacity: 0; } }
  @keyframes blink { 50% { opacity: 0; } }

  /* Weather, top right corner */
  .weather { position: absolute; right: 76px; top: 52px; text-align: right; }
  .w-temp { font-size: 96px; font-weight: 700; line-height: .9; }
  .w-temp sup { font-size: 44px; font-weight: 500; vertical-align: top; position: relative; top: 8px; margin-left: 2px; }
  .w-line { margin-top: 8px; font-size: 18px; letter-spacing: 1px; color: rgba(242,239,230,.75); text-transform: uppercase; }
  .w-line b { color: #ffd400; font-weight: 500; }

  /* Quote box under the weather. The TV browser has no backdrop-filter, so the "glass" is a
     blurred copy of the current photo lined up with the real one behind the box. */
  .quote { position: absolute; right: 76px; top: 236px; width: 540px; overflow: hidden; border-radius: 14px;
    border: 1px solid rgba(255,255,255,.16); box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .q-bg { position: absolute; width: 1920px; height: 1080px; background-size: cover; background-position: center;
    -webkit-filter: blur(22px) brightness(.6) saturate(1.2); filter: blur(22px) brightness(.6) saturate(1.2); }
  .q-tint { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(14,14,14,.28); }
  .q-body { position: relative; padding: 22px 30px 26px; -webkit-transition: opacity .5s ease; transition: opacity .5s ease; }
  .q-body.out { opacity: 0; }
  .q-label { font-size: 15px; color: #ffd400; letter-spacing: 1px; }
  .q-setup { margin-top: 12px; font-size: 31px; font-weight: 500; line-height: 1.18; }
  .q-punch { margin-top: 10px; font-size: 31px; font-weight: 700; font-style: italic; line-height: 1.18; color: #ffd400; }
  .q-punch:empty { display: none; }

  /* Clock, bottom left */
  .clock { position: absolute; left: 70px; bottom: 64px; }
  .time { font-size: 250px; font-weight: 800; font-style: italic; line-height: .8; letter-spacing: -4px; }
  .time .colon { color: #ffd400; margin: 0 -6px; }
  .row { margin-top: 26px; margin-left: 8px; display: flex; align-items: center; }
  .sec { font-size: 30px; font-weight: 700; color: #0b0b0b; background: #ffd400; padding: 4px 12px; border-radius: 3px; }
  .date { margin-left: 22px; font-size: 30px; letter-spacing: 3px; text-transform: uppercase; color: rgba(242,239,230,.88); }

  /* Photo caption, bottom right */
  .caption { position: absolute; right: 76px; bottom: 70px; text-align: right; max-width: 760px; }
  .series { font-size: 46px; font-weight: 700; font-style: italic; text-transform: uppercase; letter-spacing: 1px; line-height: 1; }
  .series:before { content: ""; display: inline-block; width: 30px; height: 30px; margin-right: 16px; vertical-align: 2px;
    background-image: linear-gradient(45deg, #f2efe6 25%, transparent 25%, transparent 75%, #f2efe6 75%),
                      linear-gradient(45deg, #f2efe6 25%, transparent 25%, transparent 75%, #f2efe6 75%);
    background-size: 15px 15px; background-position: 0 0, 7.5px 7.5px; -webkit-transform: skewX(-10deg); transform: skewX(-10deg); }
  .credit { margin-top: 12px; font-size: 14px; color: rgba(242,239,230,.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .progress { position: absolute; left: 0; bottom: 0; height: 5px; width: 0; background: #ffd400; }
</style>
</head>
<body>
<div id="slides"></div>
<div class="shade-top"></div>
<div class="shade-bot"></div>

<div class="brand">
  <div class="brand-name"><span class="tag">&lt;/&gt;</span>ICT Department</div>
  <div class="brand-sub mono">// software development<span class="cursor"></span></div>
</div>

<div class="weather">
  <div class="w-temp" id="w-temp">--<sup>&deg;C</sup></div>
  <div class="w-line mono" id="w-desc">Nairobi</div>
  <div class="w-line mono" id="w-meta"></div>
</div>

<div class="quote" id="quote">
  <div class="q-bg" id="q-bg"></div>
  <div class="q-tint"></div>
  <div class="q-body" id="q-body">
    <div class="q-label mono" id="q-label">// tech.joke()</div>
    <div class="q-setup" id="q-setup"></div>
    <div class="q-punch" id="q-punch"></div>
  </div>
</div>

<div class="clock">
  <div class="time"><span id="hh">--</span><span class="colon">:</span><span id="mm">--</span></div>
  <div class="row"><span class="sec mono" id="sec">00</span><span class="date mono" id="date"></span></div>
</div>

<div class="caption">
  <div class="series" id="series"></div>
  <div class="credit mono" id="credit"></div>
</div>
<div class="progress" id="progress"></div>

<script src="photos.js"></script>
<script src="quotes.js"></script>
<script>
(function () {
  var CITY = { name: 'Nairobi', lat: -1.2864, lon: 36.8172 };
  var UTC_OFFSET_HOURS = 3;            // East Africa Time, independent of the TV's own clock settings
  var SLIDE_SECONDS = 20;
  var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var SERIES = { 'Formula 1': 'Formula 1', 'Le Mans': '24 Heures du Mans' };

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  // ---- Clock ----
  function tick() {
    var d = new Date(Date.now() + UTC_OFFSET_HOURS * 3600000);
    $('hh').textContent = pad(d.getUTCHours());
    $('mm').textContent = pad(d.getUTCMinutes());
    $('sec').textContent = pad(d.getUTCSeconds());
    $('date').textContent = DAYS[d.getUTCDay()] + ' ' + pad(d.getUTCDate()) + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
  }
  tick();
  setInterval(tick, 1000);

  // ---- Weather (Open-Meteo, no key needed) ----
  function describe(code) {
    if (code === 0) return 'Clear';
    if (code === 1) return 'Mostly clear';
    if (code === 2) return 'Partly cloudy';
    if (code === 3) return 'Overcast';
    if (code === 45 || code === 48) return 'Fog';
    if (code >= 51 && code <= 57) return 'Drizzle';
    if (code >= 61 && code <= 67) return 'Rain';
    if (code >= 80 && code <= 82) return 'Showers';
    if (code >= 95) return 'Thunderstorm';
    return 'Cloudy';
  }
  function loadWeather() {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + CITY.lat + '&longitude=' + CITY.lon +
      '&current=temperature_2m,weather_code,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min&timezone=Africa%2FNairobi&forecast_days=1';
    var x = new XMLHttpRequest();
    x.open('GET', url);
    x.onload = function () {
      try {
        var r = JSON.parse(x.responseText), c = r.current;
        $('w-temp').innerHTML = Math.round(c.temperature_2m) + '<sup>&deg;C</sup>';
        $('w-desc').innerHTML = CITY.name + ' &middot; <b>' + describe(c.weather_code) + '</b>';
        $('w-meta').innerHTML = 'H ' + Math.round(r.daily.temperature_2m_max[0]) + '&deg; &nbsp;L ' +
          Math.round(r.daily.temperature_2m_min[0]) + '&deg; &nbsp;RH ' + c.relative_humidity_2m + '%';
      } catch (e) {}
    };
    x.send();
  }
  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  // ---- Quotes: the local deck, mixed with programming jokes from JokeAPI when online ----
  var deck = [], online = [], seen = {}, fromOnline = false, jokeNo = 0;
  function refillOnline() {
    var x = new XMLHttpRequest();
    x.open('GET', 'https://v2.jokeapi.dev/joke/Programming?safe-mode&blacklistFlags=nsfw,religious,political,racist,sexist,explicit&amount=10');
    x.onload = function () {
      try {
        var jokes = JSON.parse(x.responseText).jokes || [];
        for (var i = 0; i < jokes.length; i++) {
          var j = jokes[i], q = j.type === 'twopart' ? [j.setup, j.delivery] : [j.joke, ''];
          var text = q[0] + q[1];
          if (seen[j.id] || text.length > 150 || /\n/.test(text)) continue;
          seen[j.id] = true;
          online.push(q);
        }
      } catch (e) {}
    };
    x.send();
  }
  function splitJoke(s) {
    // "Why ...? Because ..." reads better as a setup and a punchline.
    var m = /^((?:Why|What|How|Where|Who)[^?]*\?)\s+(.+)$/.exec(s);
    return m ? [m[1], m[2]] : [s, ''];
  }
  function nextQuote() {
    var q;
    fromOnline = !fromOnline;
    if (fromOnline && online.length) q = online.shift();
    else {
      if (!deck.length) deck = shuffle((window.QUOTES || []).slice());
      q = splitJoke(deck.pop() || '');
    }
    if (online.length < 4) refillOnline();
    return q;
  }
  function showQuote() {
    var q = nextQuote(), body = $('q-body');
    jokeNo++;
    body.className = 'q-body out';
    setTimeout(function () {
      $('q-label').textContent = '// tech.joke(' + (jokeNo < 10 ? '00' : jokeNo < 100 ? '0' : '') + jokeNo + ')';
      $('q-setup').textContent = q[0];
      $('q-punch').textContent = q[1];
      body.className = 'q-body';
    }, 500);
  }
  refillOnline();

  // Line the blurred copy up with the real photo behind the box.
  var qbg = $('q-bg'), qbox = $('quote');
  qbg.style.left = -qbox.offsetLeft + 'px';
  qbg.style.top = -qbox.offsetTop + 'px';

  // ---- Wallpapers ----
  var photos = shuffle((window.PHOTOS || []).slice());
  var layers = [document.createElement('div'), document.createElement('div')], front = 0, idx = 0;
  layers[0].className = layers[1].className = 'slide';
  $('slides').appendChild(layers[0]);
  $('slides').appendChild(layers[1]);

  function show() {
    if (!photos.length) return;
    var p = photos[idx % photos.length], next = layers[1 - front], img = new Image();
    idx++;
    img.onload = function () {
      next.style.backgroundImage = 'url("img/' + p.file + '")';
      next.className = 'slide';
      void next.offsetWidth;            // restart the drift animation
      next.className = 'slide show';
      layers[front].className = 'slide';
      front = 1 - front;
      qbg.style.backgroundImage = 'url("img/' + p.file + '")';
      showQuote();
      $('series').textContent = SERIES[p.kind] || p.kind;
      $('credit').textContent = 'Photo: ' + p.credit;
      var bar = $('progress');
      bar.style.transition = 'none'; bar.style.width = '0';
      void bar.offsetWidth;
      bar.style.transition = 'width ' + SLIDE_SECONDS + 's linear'; bar.style.width = '100%';
    };
    img.onerror = function () { show(); };
    img.src = 'img/' + p.file;
  }
  show();
  setInterval(show, SLIDE_SECONDS * 1000);

  // ---- Full screen: the browser only allows it in response to a key press or click ----
  function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement || document.webkitIsFullScreen); }
  function goFull() {
    if (isFull()) return;
    var el = document.documentElement, fs = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fs) fs.call(el);
  }
  document.addEventListener('click', goFull);
  document.addEventListener('keydown', function (e) { if (e.keyCode === 13) goFull(); });

  // ---- Heartbeat: tells ict_screen.py on the PC that this page is on screen ----
  function ping() {
    if (document.hidden || document.webkitHidden) return;
    var x = new XMLHttpRequest();
    x.open('GET', '/ping?fs=' + (isFull() ? 1 : 0) + '&t=' + Date.now());
    x.send();
  }
  ping();
  setInterval(ping, 15000);
  document.addEventListener('fullscreenchange', ping);
  document.addEventListener('webkitfullscreenchange', ping);
})();
</script>
</body>
</html>
